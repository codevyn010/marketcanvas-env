[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketcanvas-env"
version = "0.1.0"
description = "A deterministic 2D design canvas RL environment with MCP server integration"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "mcp[cli]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pygame-ce>=2.5.0",
]

[tool.setuptools.packages.find]
include = ["marketcanvas*"]
